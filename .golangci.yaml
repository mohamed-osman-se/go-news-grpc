# golangci-lint config for Ubuntu
run:
  concurrency: 4
  issues-exit-code: 1
  tests: true
  timeout: 5m

linters-settings:
  errcheck:
    check-blank: true
    check-type-assertions: true
  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
  gocyclo:
    min-complexity: 15
  gofumpt:
    extra-rules: true
  goimports:
    # Leave blank or set your local module path
    local-prefixes: ""
  gosimple:
    checks: ["all"]
  govet:
    enable-all: true
    disable:
      - fieldalignment
  ireturn:
    allow:
      - error
  lll:
    line-length: 160
  misspell:
    locale: US
  nolintlint:
    allow-unused: false
    require-explanation: true
    require-specific: true
  prealloc:
    simple: true
    range-loops: true
    for-loops: true
  promlinter:
    strict: true
  revive:
    rules:
      - name: blank-imports
        disabled: true
      - name: var-declaration
        disabled: true
  staticcheck:
    checks: ["all"]
  stylecheck:
    checks: ["all"]

linters:
  enable:
    - errcheck
    - gocritic
    - gocyclo
    - gofumpt
    - goimports
    - gosimple
    - govet
    - ireturn
    - lll
    - misspell
    - nolintlint
    - prealloc
    - promlinter
    - revive
    - staticcheck
    - stylecheck

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - bodyclose
        - forcetypeassert
        - goconst
        - ireturn
        - dupl
